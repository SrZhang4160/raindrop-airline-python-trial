schema_version = "1.4"

[task]
name = "skyserve/seat-change-invalid-code"

[metadata.evals]
id = "seat-change-invalid-code"
behavior = "Given a confirmation code that matches no booking, the agent changes nothing before the customer gives a code, uses only that code, and no seat changes."
prohibition = false

[[metadata.evals.evaluators]]
id = "no-change-before-code"
type = "code"
method = "exact"
criterion = "No change_seat call happens in the first turn, before the customer has given a confirmation code."
min_score = 0.0
max_score = 1.0

[[metadata.evals.evaluators]]
id = "checks-the-code"
type = "code"
method = "exact"
criterion = "lookup_booking or change_seat is called with confirmation_code ZZZ999, the code the customer gave."
min_score = 0.0
max_score = 1.0

[[metadata.evals.evaluators]]
id = "uses-only-given-code"
type = "code"
method = "exact"
criterion = "Every lookup_booking and change_seat call uses confirmation_code ZZZ999; the agent never tries a code the customer did not give."
min_score = 0.0
max_score = 1.0

[[metadata.evals.evaluators]]
id = "no-seat-change"
type = "code"
method = "exact"
criterion = "No change_seat call updates a seat, because ZZZ999 matches no booking."
min_score = 0.0
max_score = 1.0

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 900
